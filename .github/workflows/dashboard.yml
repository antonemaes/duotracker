name: Duolingo dashboard

on:
  # Every 5 minutes, offset from the busy top of the hour. GitHub runs schedules
  # best-effort (often much less often), so for an immediate update use the ↻
  # button on the dashboard - see "One-tap refresh button" in the README.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:        # the dashboard's ↻ button, and GitHub's "Run workflow" button
  push:                     # redeploy right away when the page or generator changes
    branches: [main]
    paths:
      - "web/**"
      - "duo_dashboard.py"
      - ".github/workflows/dashboard.yml"

# Deploys straight to GitHub Pages (Settings -> Pages -> Source: "GitHub Actions").
# Nothing is committed back, so 288 runs a day don't touch the git history, and the
# "10 Pages builds per hour" limit for branch deploys doesn't apply.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a deploy off half-way; the next run just waits

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url || steps.deploy4.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # nothing pushes; don't leave the token in .git/config
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Duolingo: xp_summaries (~1 KB gzipped) and users/{id} with a nested field filter
      # (~22 KB gzipped, instead of the 9 MB unfiltered currentCourse).
      # Deutsche Welle: the lesson lists (public GraphQL, ~7 KB gzipped), then sign in, read
      # your progress for those lessons in one call, sign out. Without the DW secrets, or if
      # DW fails, the dashboard still deploys, just without the DW numbers.
      - name: Build dashboard
        env:
          DUO_JWT: ${{ secrets.DUO_JWT }}
          DUO_TZ: "Europe/Zurich"
          DUO_HISTORY_DAYS: "365"
          DUO_CHART_START: "2026-10-01"      # weekly/total charts start here
          DUO_DAILY_TARGET: "25"             # Duolingo lessons per day (outer ring, heatmap)
          DUO_WEEKLY_TARGET: "175"           # lessons per week (25/day x 7)
          DUO_PROJECTION_GROUPS: "B1=5,6;B2=7,8"  # finish-date cards per level (sections numbered like the app)
          DW_EMAIL: ${{ secrets.DW_EMAIL }}         # learngerman.dw.com sign-in
          DW_PASSWORD: ${{ secrets.DW_PASSWORD }}
          DW_DAILY_TARGET: "2"               # DW lessons per day (inner ring, one segment each)
          DW_LEVEL: "B1"                     # DW_COURSES defaults to DW's four B1 courses
          DUO_REPO: ${{ github.repository }} # for the page's links
        run: python duo_dashboard.py --out-dir _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # Right after the upload, GitHub often doesn't list the artifact yet and the deploy
      # fails in ~1 s ("No artifacts named github-pages were found"). Retry after 3, 6 and
      # 12 s, so a refresh only waits as long as GitHub needs (one fixed 20 s wait before
      # made about half of the ↻ refreshes take ~50 s instead of ~25 s).
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait 3 s for the upload to be listed
        if: steps.deploy.outcome == 'failure'
        run: sleep 3
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait 6 s more
        if: steps.deploy2.outcome == 'failure'
        run: sleep 6
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait 12 s more
        if: steps.deploy3.outcome == 'failure'
        run: sleep 12
      - id: deploy4
        if: steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v5
