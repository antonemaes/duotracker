name: Duolingo dashboard

on:
  schedule:
    # Daily at 05:23 UTC (06:23 Zurich in winter, 07:23 in summer).
    # GitHub cron is best-effort; the dashboard always reflects "today" whenever it runs.
    - cron: "23 5 * * *"
  workflow_dispatch:        # "Run workflow" button for manual refreshes

# avoid a scheduled run and a manual run pushing at the same time
concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: write           # needed to commit index.html back to the repo

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This job runs once a day on purpose: duo_dashboard.py also fetches
      # users/{id}?fields=currentCourse (~9 MB) for live section/unit progress.
      # The hourly nudge job only uses the small xp_summaries endpoint.
      - name: Generate dashboard
        env:
          DUO_JWT: ${{ secrets.DUO_JWT }}
          DUO_TZ: "Europe/Zurich"
          DUO_HISTORY_DAYS: "365"
          DUO_CHART_START: "2026-10-01"      # graph x-axis starts here (Oct 2026)
          DUO_WEEKLY_TARGET: "175"           # bar target per week (25 lessons/day x 7)
          DUO_PROJECTION_END: "2027-03-31"   # end of Q1 2027
          DUO_PROJECTION_SECTIONS: "5,6"
        run: python duo_dashboard.py --out index.html
      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged"
          else
            git commit -m "Update dashboard [skip ci]"
            git push
          fi
